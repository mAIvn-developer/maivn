[build-system]
requires = ['hatchling>=1.27']
build-backend = 'hatchling.build'

[project]
name = 'maivn'
version = '2.0.0'
description = 'Python SDK for mAIvn Platform v2.'
readme = 'README.md'
requires-python = '>=3.10'
license = 'Apache-2.0'
license-files = ['LICENSE', 'NOTICE']
dependencies = [
  'croniter>=2.0.1',
  'httpx>=0.28',
  'maivn-contracts>=0.1.0,<0.2',
  'orjson>=3',
  'private-data-vault>=0.1.0,<0.2',
  'pydantic>=2.13.5',
  'pydantic-settings>=2',
  'typing-extensions>=4.12',
  # Scheduling resolves named timezones via zoneinfo, which has no bundled
  # database on Windows.
  'tzdata; sys_platform == "win32"',
]

[project.scripts]
maivn = 'maivn.cli:main'

[project.optional-dependencies]
# maivn.events.fastapi serves an EventBridge over SSE. Only an app backend needs it, so
# FastAPI is not forced on every SDK consumer.
fastapi = ['fastapi>=0.115', 'sse-starlette>=2']
# Instrumentation libraries depend on the OpenTelemetry API only. Applications
# choose and configure their SDK, processor, and exporter.
otel = ['opentelemetry-api>=1.30,<2']
# Enhanced (Tier 1) terminal output. Plain-text reporting works without it, so
# Rich is not forced on every SDK consumer.
rich = ['rich>=14.3.4']

[dependency-groups]
dev = [
  'fastapi>=0.115',
  'sse-starlette>=2',
  'rich>=14.3.4',
  'basedpyright',
  'opentelemetry-sdk>=1.30,<2',
  'pytest',
  'ruff',
]

[tool.uv.sources]
maivn-contracts = { path = '../maivn-contracts', editable = true }
private-data-vault = { path = '../maivn-private-data-vault/crates/private-data-vault-py', editable = true }

[tool.hatch.build.targets.wheel]
packages = ['src/maivn']

# Keep the source distribution limited to SDK code. Public guides are versioned
# and published separately from this package.
[tool.hatch.build.targets.sdist]
only-include = ['src/maivn', 'LICENSE', 'NOTICE', 'README.md']

[tool.pytest.ini_options]
addopts = [
  '--import-mode=importlib',
]
pythonpath = [
  'src',
]
testpaths = [
  'tests',
]

[tool.ruff]
line-length = 100
target-version = 'py310'

[tool.ruff.format]
quote-style = 'single'

# LF on every platform. The default, "auto", keeps whatever ending a file
# already carries, which is how CRLF kept arriving from Windows editors.
line-ending = 'lf'

[tool.ruff.lint]
select = ['ALL']
ignore = [
  # `Any` is load-bearing where the SDK hands back an opaque customer payload or binds
  # the optional vault wheel by name. The annotation is honest there, not lazy.
  'ANN401',
  # Ruff documents COM812 and ISC001 as conflicting with its own formatter, so both stay
  # off; otherwise `ruff format` and `ruff check` disagree about the same line.
  'COM812',
  # No source file in this repository carries a copyright header and none is planned.
  # The rule is preview-gated, so it reports nothing until preview is enabled; the waiver
  # stays so that turning preview on does not flag all 169 files.
  'CPY001',
  # D203/D211 and D213/D212 are mutually exclusive pairs. D211 and D212 are the halves
  # that match `ruff format`'s docstring layout, so their partners are the ones waived.
  'D203',
  'D213',
  # `tests/` is an implicit namespace package on purpose: pytest runs in importlib mode,
  # so there is no `__init__.py` for INP001 to find.
  'INP001',
  # See COM812 - the second half of ruff's formatter-conflict pair.
  'ISC001',
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ['pydantic.BaseModel']

[tool.ruff.lint.per-file-ignores]
# Asserting is what a test does; S101 exists to keep asserts out of shipped code.
'tests/**/*.py' = ['S101']
# Writing to the terminal is the entire job of a terminal reporter.
'src/maivn/_internal/reporting/terminal_reporter/**/*.py' = ['T201']
# A CLI prints to the terminal and launches Studio as a subprocess. Both are the job.
'src/maivn/cli.py' = ['T201', 'S603']
# Keep compatibility-module exceptions scoped to the event package.
'src/maivn/events/**/*.py' = [
  'C901', 'D205', 'D301', 'D417', 'EM101', 'EM102', 'ERA001', 'G004',
  'N802', 'PERF401', 'PLC0415', 'PLR0911', 'PLR0912', 'PLR0913', 'PLR0915', 'RUF022',
  'S110', 'SIM108', 'SIM118', 'TRY003', 'TRY300',
]
# Keyword-only builders that mirror the AppEvent contract field for field: the arity and
# branching are the contract's shape (C901, PLR0912, PLR0913), and each docstring
# describes the payload rather than restating every field (D417). ERA001 fires on the
# `# MARK:` section markers, not on dead code.
'src/maivn/_internal/reporting/app_event_payloads/**/*.py' = [
  'C901', 'D417', 'ERA001', 'PLR0912', 'PLR0913',
]

[tool.basedpyright]
pythonVersion = '3.10'
typeCheckingMode = 'strict'
reportUnnecessaryTypeIgnoreComment = 'error'
include = [
  'src',
  'tests',
]
