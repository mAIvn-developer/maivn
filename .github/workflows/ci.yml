name: CI

# Standalone check for this public package repository. The development
# environment ([tool.uv.sources]) points at sibling packages that only exist in
# the platform monorepo, so this workflow never syncs it. It proves what a user
# gets: the distributions build without path sources, pass twine, and the wheel
# installs from PyPI-published dependencies into a clean environment.

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: maivn-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Release guard self-test (offline)
        run: uv run --with packaging --no-project --python 3.12 python scripts/release_guard_test.py

      - name: Build distributions
        run: uv build --no-sources

      - name: Validate distributions
        run: uvx twine check dist/*

      - name: Install the wheel into a clean environment
        run: |
          uv venv .ci --python ${{ matrix.python-version }}
          uv pip install --python .ci/bin/python dist/*.whl

      - name: Import smoke test
        run: .ci/bin/python -c "import maivn, maivn_contracts, private_data_vault; print(maivn.__version__)" && .ci/bin/maivn --help
