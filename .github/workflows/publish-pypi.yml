name: Publish PyPI

# Trusted publishing (OIDC): PyPI's publisher for this project is bound to this
# repository, this workflow file name and the "pypi" environment. Keep all three.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: maivn-pypi-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Release guard self-test (offline)
        run: uv run --with packaging --no-project --python 3.12 python scripts/release_guard_test.py
      - name: Validate release version
        # release_guard imports tomllib (3.11+ stdlib); pin the interpreter explicitly.
        run: uv run --with packaging --no-project --python 3.12 python scripts/release_guard.py

      - name: Build distributions
        # --no-sources: the [tool.uv.sources] path entries are development-only and
        # must never reach a published distribution.
        run: uv build --no-sources

      - name: Validate distributions
        run: uvx twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
